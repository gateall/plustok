services:
  mariadb-test:
    image: mariadb:11
    container_name: plustok_contract_mariadb_test
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-plustok_root_local_only}
      MYSQL_DATABASE: plustok_contract_test
      MYSQL_USER: plustok_test
      MYSQL_PASSWORD: ${MARIADB_TEST_PASSWORD:-plustok_test_local_only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - plustok_contract_test_data:/var/lib/mysql

volumes:
  plustok_contract_test_data:
