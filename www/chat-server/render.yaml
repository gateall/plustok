# Render Blueprint — chat-server
# UI: Root Directory = www/chat-server, Dockerfile Path = Dockerfile

services:
  - type: web
    name: plustok-chat-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://plustok.mycafe24.com/api/v1
      - key: CORS_ALLOWED_ORIGINS
        value: https://plustok.mycafe24.com
      - key: JWT_SECRET
        sync: false
      - key: CHAT_INTERNAL_SECRET
        sync: false
        # PHP ACEP_CHAT_INTERNAL_SECRET 과 동일 (미설정 시 JWT_SECRET 사용)
