# Nginx snippet — WebSocket reverse proxy (VPS / Docker acep-nginx)
# Mount or include in server { listen 443 ssl; ... }

upstream acep_chat {
    ip_hash;
    server 127.0.0.1:3001;
    keepalive 32;
}

# Socket.io (path must match chat-server: path '/socket.io')
location /socket.io/ {
    proxy_pass http://acep_chat;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

# PM2 health (optional — restrict to internal/monitoring IP)
location = /chat-health {
    proxy_pass http://acep_chat/health;
    access_log off;
}
